version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    assignees:
      - "your-username"
    reviewers:
      - "your-username"
    labels:
      - "dependencies"
      - "npm"
    groups:
      dependency-groups:
        patterns:
          - "*"
    versioning-strategy: increase
