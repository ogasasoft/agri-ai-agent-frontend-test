name: CI/CD Pipeline

on:
  push:
    branches: [ main, 'feature/*', 'update/*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test-only:
        description: 'Run only tests (skip lint and build)'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '20'

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check || echo "Formatting check failed - run 'npm run format' to fix"

      - name: Run lint-staged checks
        run: npm run lint-staged

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Preview production build
        run: npm run preview

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: .next/

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate || echo "Security vulnerabilities found. Review manually."

      - name: Run nsp audit (optional, requires nsp package)
        run: nsp audit || echo "nsp not installed, skipping"

  deploy:
    name: Deploy to Preview
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

  docker-build:
    name: Docker Build & Test (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/agri-ai-agent
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build Docker image with Next.js
        run: |
          docker build -t agri-ai-agent:${{ github.sha }} -f Dockerfile .
          docker build -t agri-ai-agent:${{ github.sha }} -f Dockerfile .

      - name: Run container and verify
        run: |
          docker run -d --name test-container -p 3000:3000 agri-ai-agent:${{ github.sha }}
          sleep 15
          curl -f http://localhost:3000 || exit 1
          docker stop test-container
          docker rm test-container

      - name: Run tests in Docker
        run: |
          docker run --rm -v $(pwd)/coverage:/app/coverage agri-ai-agent:${{ github.sha }} npm run test:ci

      - name: Upload Docker build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-agri-${{ github.sha }}
          path: |
            agri-ai-agent:${{ github.sha }}
          retention-days: 7

      - name: Build and push to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker tag agri-ai-agent:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/agri-ai-agent:latest
          docker tag agri-ai-agent:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/agri-ai-agent:${{ github.ref_name }}
          docker push ${{ secrets.DOCKER_USERNAME }}/agri-ai-agent:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/agri-ai-agent:${{ github.ref_name }}
